server.port=0

# ---- 配置热加载 ----
# 本地配置来源，列表顺序即优先级（越靠后优先级越高，覆盖前者）
# config.reload.sources[0].path=./config/base.properties
# config.reload.sources[0].name=base
# config.reload.sources[1].path=./config/override.properties
# config.reload.sources[1].name=override

# 防抖窗口：短时间内的连续变更合并为一次重载（默认 200ms）
config.reload.debounce=200ms
# 重载失败后的重试次数（默认 3）
config.reload.max-retries=3
# 重试间隔（默认 500ms）
config.reload.retry-interval=500ms
# 一次重载（含重试）的最长等待时间，超时放弃本轮并保持旧版本（默认 5s）
config.reload.max-wait=5s
# 是否启用文件变更自动监听（默认 true）
config.reload.watch-enabled=true
